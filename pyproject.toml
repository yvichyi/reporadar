[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reporadar-local"
version = "0.4.0"
description = "Read-only local Git repository radar and preflight sensor for coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["git", "cli", "developer-tools", "agents", "mcp", "preflight"]
authors = [{ name = "reporadar contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/yvichyi/reporadar"
Repository = "https://github.com/yvichyi/reporadar"

[project.scripts]
reporadar = "reporadar_local.cli:main"
reporadar-mcp = "reporadar_local.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reporadar_local"]
